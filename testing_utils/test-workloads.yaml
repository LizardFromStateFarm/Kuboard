apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-statefulset
  labels:
    app: test-statefulset
    tier: testing
spec:
  serviceName: "test-statefulset"
  replicas: 2
  selector:
    matchLabels:
      app: test-statefulset
  template:
    metadata:
      labels:
        app: test-statefulset
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: test-daemonset
  labels:
    app: test-daemonset
    tier: testing
spec:
  selector:
    matchLabels:
      app: test-daemonset
  template:
    metadata:
      labels:
        app: test-daemonset
    spec:
      containers:
      - name: node-exporter-mock
        image: busybox
        command: ["/bin/sh", "-c", "while true; do echo 'Node metrics collector running...'; sleep 10; done"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-cronjob
  labels:
    app: test-cronjob
    tier: testing
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cron-worker
            image: busybox
            command: ["/bin/sh", "-c", "echo 'CronJob executed successfully at' $(date)"]
          restartPolicy: OnFailure
---
apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    app: multi-container-pod
    tier: testing
spec:
  initContainers:
  - name: init-myservice
    image: busybox:1.28
    command: ['sh', '-c', 'echo "Init container running..."; sleep 2']
  containers:
  - name: web-app
    image: nginx:alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
  - name: sidecar-logger
    image: busybox
    command: ["/bin/sh", "-c", "while true; do echo '[Sidecar] Monitoring web app health...'; sleep 7; done"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
---
# Failing workloads for testing error badges & status rendering in Kuboard
apiVersion: v1
kind: Pod
metadata:
  name: test-failing-crashloop
  labels:
    app: test-failing
    type: crashloop
spec:
  containers:
  - name: failing-app
    image: busybox
    command: ["/bin/sh", "-c", "echo 'Simulating fatal crash...'; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-failing-imagepull
  labels:
    app: test-failing
    type: imagepull
spec:
  containers:
  - name: missing-image
    image: non-existent-registry.example.com/bogus-image:v99.99
